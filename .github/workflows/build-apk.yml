name: Build APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare
        # local.properties in the repo points at a Windows SDK path; the runner provides ANDROID_HOME.
        run: |
          rm -f local.properties
          chmod +x gradlew

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Aahnik.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Aahnik-apk
          path: Aahnik.apk
          if-no-files-found: error
