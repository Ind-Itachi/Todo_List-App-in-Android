name: Build YT Background APK

on:
  push:
    branches: [ccr-38be2d24-x40wkq, main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Point Gradle at the runner's Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :youtube:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YT-Background-apk
          path: youtube/build/outputs/apk/debug/*.apk
